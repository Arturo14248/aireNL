
# .pre-commit-config.yaml

default_language_version:
  python: python3

fail_fast: false

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml ## yaml syntax check
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace # removes unnecessary trailing whitespace
      - id: check-merge-conflict # detects merge conflict markers in files
      - id: check-added-large-files
        exclude: ^uv\.lock$ # lockfiles are generated and must be committed
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format # formats python code according to PEP 8
